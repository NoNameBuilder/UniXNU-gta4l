name: build-xnu-kernel-gta4l

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name (empty = this repository)
        required: false
        default: ""
      device_ref:
        description: Device repository ref (empty = the ref this run was started on)
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
      XNU_BOOT_PROGRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Oldest Xcode (Fixes XNU-10063 MIG/Headers)
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode found"
          fi
          xcodebuild -version
          xcrun --find clang

      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          git clone --recurse-submodules --depth 1 --shallow-submodules https://github.com/UniXNU/UniXNU.git UniXNU

      - name: Checkout Device Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository || github.repository }}
          ref: ${{ inputs.device_ref || github.ref_name }}
          path: device
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig gta4l_defconfig -D "$GITHUB_WORKSPACE/device"

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60
  
      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 120

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Inject Xcode 16 Fixes for Host Tools
        run: |
          cd UniXNU/out/gta4l/tree
          python3 - << 'EOF'
          import pathlib
          p = pathlib.Path("scripts/build-xnu-4k-baseline.sh")
          if p.exists():
              lines = p.read_text().splitlines()
              new_lines = []
              for line in lines:
                  # Intercept the exact line where it compiles the host tools
                  if 'make -C .cache/xnu-work installhdrs' in line:
                      new_lines.append('echo "=> Stripping strict Xcode 16 warnings from SETUP host tools..."')
                      new_lines.append('find .cache/xnu-work/SETUP -type f -name "Makefile*" -exec sed -i \'\' \'s/-Werror//g\' {} + || true')
                      new_lines.append('find .cache/xnu-work/SETUP -type f -name "*.c" -exec sed -i \'\' \'s/int lpos, len = 0;/int len = 0;/g\' {} + || true')
                      # Force disable all implicit function errors on the Make command
                      line = line.replace('make -C', 'make WERROR="" HOST_WERROR="" HOST_CFLAGS="-w -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int" -C')
                  new_lines.append(line)
              p.write_text("\n".join(new_lines) + "\n")
              print("Successfully injected Xcode 16 bypass into baseline script!")
          EOF

      - name: Inject GITHUB_TOKEN into API scripts
        run: |
          cd UniXNU/out/gta4l/tree
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          # Fix prepare-xnu-source.py if it exists
          prep_script = Path("scripts/prepare-xnu-source.py")
          if prep_script.exists():
              code = prep_script.read_text()
              if "import pathlib" not in code:
                  prep_script.write_text("import pathlib\nimport os\nimport urllib.request\nimport json\nimport sys\n" + code)
                  print("Fixed missing imports in prepare-xnu-source.py")
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token present:", bool(token))
          patched = 0
          for f in glob.glob("scripts/*.py"):
              p = Path(f)
              s = p.read_text()
              if "api.github.com" not in s or "_UNIXNU_TOKEN_PATCH" in s:
                  continue
              if "import urllib.request" not in s:
                  continue
              patch = "import urllib.request\n_gh_token = __import__(\"os\").environ.get(\"GITHUB_TOKEN\", \"\")\nif _gh_token:\n    _orig_urlopen = urllib.request.urlopen\n    def _urlopen(url, *a, **kw):\n        req = urllib.request.Request(url) if isinstance(url, str) else url\n        req.add_header(\"Authorization\", \"Bearer \" + _gh_token)\n        req.add_header(\"Accept\", \"application/vnd.github+json\")\n        return _orig_urlopen(req, *a, **kw)\n    urllib.request.urlopen = _urlopen"
              s = s.replace("import urllib.request", patch, 1)
              p.write_text(s)
              patched += 1
              print("patched:", f)
          print("total:", patched)
          PY

      - name: Pre-cache XNU headers to /tmp (no API calls during build)
        run: |
          cd UniXNU/out/gta4l/tree
           mkdir -p .cache/sources
           TAG="xnu-10063.121.3"
           TRUST_TAG="xnu-8796.101.5"
            SHORT=${TAG#xnu-}
            TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          
          AUTH_HEADER=""
          if [ -n "${{ env.GITHUB_TOKEN }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ env.GITHUB_TOKEN }}"
          fi

          curl -sL --fail ${AUTH_HEADER:+-H "$AUTH_HEADER"} -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json" || true
          curl -sL --fail ${AUTH_HEADER:+-H "$AUTH_HEADER"} -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json" || true
          curl -sL --fail ${AUTH_HEADER:+-H "$AUTH_HEADER"} -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json" || true
          echo "=== cached json ==="
          ls -la .cache/sources/

      - name: Verify archive builders
        run: |
          cd UniXNU/out/gta4l/tree
          python3 - <<'PY'
          import tomllib, pathlib
          b = tomllib.loads(pathlib.Path('board.toml').read_text())
          print('archives:', b.get('kernel', {}).get('archives'))
          for entry in b.get('kernel', {}).get('archives', []):
              name = entry.split()[0]
              print(name, 'exists' if pathlib.Path('scripts', name).is_file() else 'MISSING')
          PY
      - name: Clean build cache and fix setup
        run: |
          cd UniXNU
          rm -rf out/gta4l/tree/.cache/xnu-work out/gta4l/build
          export CFLAGS="-Wno-error -Wno-unused-but-set-variable -Wno-deprecated-declarations"
          export HOST_CFLAGS="-Wno-error -Wno-unused-but-set-variable -Wno-deprecated-declarations"

      - name: Force patch SETUP config Makefile for Xcode 16
        run: |
          cd UniXNU
          find . -path "*/SETUP/config/Makefile.in" -o -path "*/config/Makefile.in" | while read -r f; do
            echo "Patching $f"
            echo "CFLAGS += -w -Wno-error -Wno-unused-but-set-variable -Wno-deprecated-declarations" >> "$f"
          done
          find . -name "mkmakefile.c" -exec sed -i '' 's/int lpos, len = 0;/int len = 0; \/* lpos removed *\/ /g' {} +

      - name: Build kernel
        run: |
          cd UniXNU
          ./unixnu fetch xnu || true
          ./unixnu tree || true
          ls -la out/gta4l/tree/refer/ || true
          ./unixnu build kernel
          ls -lh out/gta4l/kernel/ || true
        timeout-minutes: 180

      - name: Prelink kernel against the IPSW kernelcache
        run: |
          cd UniXNU
          ./unixnu build prelink
          ls -lh out/gta4l/kernel/ || true
        timeout-minutes: 30

      - name: Dump build log on failure
        if: failure()
        run: |
          for log in kernel.log kernel-bootstrap.log; do
            f="UniXNU/out/gta4l/logs/$log"
            echo "===== $log ====="
            if [ -f "$f" ]; then
              echo "--- errors ---"
              grep -n -E "error:|Undefined symbols|symbol\(s\) not found|archive built|building missing archive|WARN:|boot progress|zzz-boot-progress|duplicate symbol|make(\[[0-9]+\])?: \*\*\*|^\+ exit " "$f" | tail -60 || true
              echo "--- tail 120 ---"
              tail -120 "$f"
              echo "--- tail ---"
              tail -40 "$f"
            else
              echo "(missing)"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta4l
          path: |
            UniXNU/out/gta4l/kernel/
            UniXNU/out/gta4l/logs/
            UniXNU/out/gta4l/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          if-no-files-found: warn
